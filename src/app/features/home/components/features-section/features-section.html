<section class="py-20 bg-surface-0 dark:bg-surface-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div
      class="text-center mb-16"
      pAnimateOnScroll
      enterClass="fadein"
    >
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-primary-100 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300 text-sm font-medium mb-4">
        <i class="pi pi-bolt"></i>
        <span>¿Por qué elegirnos?</span>
      </div>

      <h2 class="text-3xl sm:text-4xl font-bold text-surface-900 dark:text-surface-0 mb-4">
        Un Servicio, Múltiples Beneficios
      </h2>

      <p class="text-lg text-surface-600 dark:text-surface-300 max-w-2xl mx-auto">
        Nos comprometemos con tu bienestar y belleza, ofreciendo un servicio integral de excelencia
      </p>
    </div>

    <!-- Grid de características -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (feature of features; track feature.title; let idx = $index) {
        <div
          pAnimateOnScroll
          enterClass="fadeinup"
          class="group"
        >
          <div class="flex flex-col items-center text-center p-6 rounded-2xl hover:bg-surface-50 dark:hover:bg-surface-800 transition-all duration-300 h-full">
            <!-- Icono -->
            <div [class]="'w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-transform duration-300 group-hover:scale-110 ' + feature.color">
              <i [class]="feature.icon" class="text-2xl"></i>
            </div>

            <!-- Título -->
            <h3 class="text-xl font-bold text-surface-900 dark:text-surface-0 mb-3">
              {{ feature.title }}
            </h3>

            <!-- Descripción -->
            <p class="text-surface-600 dark:text-surface-400 leading-relaxed">
              {{ feature.description }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
