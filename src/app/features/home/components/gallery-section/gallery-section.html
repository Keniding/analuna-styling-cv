<section class="py-20 bg-surface-50 dark:bg-surface-950">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div
      class="text-center mb-16"
      pAnimateOnScroll
      enterClass="fadein"
    >
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-primary-100 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300 text-sm font-medium mb-4">
        <i class="pi pi-images"></i>
        <span>Galería</span>
      </div>

      <h2 class="text-3xl sm:text-4xl font-bold text-surface-900 dark:text-surface-0 mb-4">
        Nuestro Trabajo en Imágenes
      </h2>

      <p class="text-lg text-surface-600 dark:text-surface-300 max-w-2xl mx-auto">
        Explora algunos de nuestros tratamientos y resultados que hablan por sí mismos
      </p>
    </div>

    <!-- Galleria de PrimeNG -->
    <div
      pAnimateOnScroll
      enterClass="zoomin"
    >
      <p-galleria
        [value]="images"
        [responsiveOptions]="responsiveOptions"
        [containerStyle]="{ 'max-width': '100%' }"
        [numVisible]="5"
        [circular]="true"
        [fullScreen]="true"
        [showItemNavigators]="true"
        [showThumbnails]="true"
        [showIndicators]="true"
        [showItemNavigatorsOnHover]="true"
        [showThumbnailNavigators]="false"
      >
        <ng-template #item let-item>
          <div class="relative">
            <img
              [src]="item.itemImageSrc"
              [alt]="item.alt"
              class="w-full h-[500px] object-cover rounded-2xl"
            />
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-surface-900/80 to-transparent p-6 rounded-b-2xl">
              <h3 class="text-xl font-bold text-white">{{ item.title }}</h3>
            </div>
          </div>
        </ng-template>

        <ng-template #thumbnail let-item>
          <div class="grid place-items-center">
            <img
              [src]="item.thumbnailImageSrc"
              [alt]="item.alt"
              class="rounded-lg"
            />
          </div>
        </ng-template>
      </p-galleria>
    </div>

    <!-- CTA -->
    <div class="text-center mt-12">
      <p-button
        label="Ver portafolio completo"
        icon="pi pi-arrow-right"
        iconPos="right"
        size="large"
        [outlined]="true"
      />
    </div>
  </div>
</section>
