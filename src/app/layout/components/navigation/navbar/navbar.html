<p-menubar [model]="items" class="border-none border-b border-surface-200 dark:border-surface-800 rounded-none">
  <ng-template #start>
    <div class="flex items-center gap-2 mr-4">
      <svg width="33" height="35" viewBox="0 0 33 35" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8">
        <path d="M15.5 0L31 8.75V26.25L15.5 35L0 26.25V8.75L15.5 0Z" fill="var(--primary-color)" />
      </svg>
      <div class="flex flex-col">
        <span class="text-lg font-bold text-surface-900 dark:text-surface-0 leading-none">
          Analuna <span class="text-primary-500">Atelier</span>
        </span>
        <span class="hidden sm:block text-[10px] uppercase tracking-widest text-surface-500 dark:text-surface-400">
          Cosmetología Integral
        </span>
      </div>
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-2">
      <p-button
        label="Reservar Cita"
        icon="pi pi-calendar"
        [rounded]="true"
        styleClass="hidden sm:inline-flex"
        (onClick)="onReservarClick()"
      />
      <p-button
        icon="pi pi-calendar"
        [rounded]="true"
        styleClass="sm:hidden"
        severity="secondary"
        [text]="true"
        (onClick)="onReservarClick()"
      />
    </div>
  </ng-template>
</p-menubar>
