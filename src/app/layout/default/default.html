<div class="min-h-screen flex flex-col bg-surface-50 dark:bg-surface-950">

  <!-- Header Superior -->
  <app-navbar />

  <!-- SpeedDial Flotante (Desktop) - Componente PrimeNG -->
  <p-speeddial
    [model]="speedDialItems"
    direction="down"
    [style]="{'position': 'fixed', 'right': '1rem', 'top': '50%', 'transform': 'translateY(-50%)', 'z-index': '50'}"
    [className]="'hidden md:flex'"
    buttonClassName="p-button-rounded p-button-outlined"
    [showIcon]="'pi pi-bars'"
    [hideIcon]="'pi pi-times'"
  />

  <!-- Navegación móvil (Bottom Bar) usando Dock -->
  <div class="md:hidden fixed bottom-0 left-0 w-full bg-surface-0/90 dark:bg-surface-900/90 backdrop-blur-md border-t border-surface-200 dark:border-surface-800 z-50">
    <div class="flex justify-around items-center px-4 py-3">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="text-primary-500"
          [routerLinkActiveOptions]="{exact: item.route === '/'}"
          class="flex flex-col items-center gap-1 text-surface-400 transition-colors min-w-[60px]"
          pRipple
        >
          <i [class]="item.icon" class="text-xl"></i>
          <span class="text-[10px] font-medium">{{ item.label }}</span>
        </a>
      }
    </div>
  </div>

  <!-- Contenido Principal -->
  <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:pr-20 pb-24 md:pb-8">
    <router-outlet />
  </main>

  <app-footer />
</div>
