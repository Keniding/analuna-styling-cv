<div class="min-h-screen flex flex-col bg-surface-50 dark:bg-surface-950">

  <!-- Header Superior -->
  <app-navbar />

  <!-- SpeedDial Flotante (Desktop): apilado sobre el botón de WhatsApp en la
       esquina inferior derecha para no cruzarse nunca con el contenido de las
       secciones (antes estaba centrado verticalmente y tapaba texto/botones). -->
  <div class="hidden md:block fixed right-4 bottom-24 z-40">
    <p-speeddial
      [model]="speedDialItems"
      direction="up"
      buttonClassName="p-button-rounded p-button-outlined"
      [showIcon]="'pi pi-bars'"
      [hideIcon]="'pi pi-times'"
    />
  </div>

  <!-- Navegación móvil (Bottom Bar) -->
  <div class="md:hidden fixed bottom-0 left-0 w-full bg-surface-0/90 dark:bg-surface-900/90 backdrop-blur-md border-t border-surface-200 dark:border-surface-800 z-50">
    <div class="flex justify-around items-center px-4 py-3">
      @for (item of menuItems; track item.label) {
        <a
          [href]="'#' + item.fragment"
          (click)="$event.preventDefault(); scrollToFragment(item.fragment)"
          class="flex flex-col items-center gap-1 text-surface-400 transition-colors min-w-[60px]"
          pRipple
        >
          <i [class]="item.icon" class="text-xl"></i>
          <span class="text-[10px] font-medium">{{ item.label }}</span>
        </a>
      }
    </div>
  </div>

  <main class="flex-grow w-full pb-20 md:pb-0">
    <router-outlet />
  </main>

  <app-footer />
</div>
